services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_DFIR_ENV: production
      AI_DFIR_DATA_DIR: /app/data
      AI_DFIR_S3_ENDPOINT: ${AI_DFIR_S3_ENDPOINT:-http://object-store:9000}
      AI_DFIR_S3_REGION: us-east-1
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ai-dfir-data:/app/data
    depends_on:
      - object-store
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777

  object-store:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AI_DFIR_S3_ACCESS_KEY:?Set AI_DFIR_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${AI_DFIR_S3_SECRET_KEY:?Set AI_DFIR_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ai-dfir-object-store:/data
    security_opt:
      - no-new-privileges:true

volumes:
  ai-dfir-data:
  ai-dfir-object-store:
