<aside class="sidebar workspace-sidebar">
  <p class="sidebar-label">WORKSPACE</p>

    </a>
    <a class="side-link" href="{% if workspace_case_id %}{{ url_for('case_detail', case_id=workspace_case_id) }}#evidence{% else %}{{ url_for('index') }}#new-case{% endif %}">

      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M3 10h14M3 16h14"/><circle cx="6" cy="4" r="1.5"/><circle cx="13" cy="10" r="1.5"/><circle cx="8" cy="16" r="1.5"/></svg>AI Findings

  <div class="sidebar-divider"></div>
  <p class="sidebar-label">ACCOUNT</p>
